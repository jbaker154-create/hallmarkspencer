<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>FLYERS - Hallmark Spencer</title>
    <style>
        @page { size: 8.5in 11in; margin: 0; }
        body { margin: 0; padding: 0; background: #fff; }
        .page-break { page-break-after: always; }
        .flyer {
            width: 8.5in;
            height: 11in;
            padding: 0.3in;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            overflow: hidden;
        }
        .border-wrap {
            border: 12px solid #2c3e50;
            height: 100%;
            padding: 25px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .logo { max-width: 260px; margin-bottom: 5px; }
        h1 { font-size: 65px; margin: 0; color: #2c3e50; letter-spacing: 4px; font-weight: 900; line-height: 1; }
        .subtitle { font-size: 22px; font-weight: bold; color: #e67e22; margin-top: 5px; text-transform: uppercase; }
        
        .building-photo-wrap {
            width: 100%;
            height: 3.5in;
            margin: 15px 0;
            background: #f8f9fa;
            border-radius: 12px;
            border: 4px solid #eee;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .building-photo { width: 100%; height: 100%; object-fit: contain; background: #f8f9fa; }
        
        .info-box { background: #2c3e50; color: white; padding: 20px; border-radius: 15px; margin-bottom: 10px; }
        .style { font-size: 38px; margin: 0; color: #e67e22; font-weight: 800; text-transform: uppercase; }
        .size { font-size: 32px; margin: 5px 0; color: #fff; font-weight: 600; }
        .price { font-size: 80px; font-weight: 900; color: #27ae60; margin: 10px 0; line-height: 0.9; }
        
        .qr-row { display: flex; gap: 20px; margin-top: 15px; }
        .qr-card { flex: 1; background: #f8f9fa; color: #2c3e50; padding: 15px; border-radius: 12px; border: 3px solid #ddd; display: flex; flex-direction: column; align-items: center; }
        .qr-card img { width: 140px; height: 140px; background: white; padding: 10px; border-radius: 8px; border: 1px solid #ccc; margin-bottom: 10px; }
        .qr-card h3 { font-size: 18px; margin: 0; color: #2c3e50; font-weight: 900; }
        .qr-card p { font-size: 12px; margin: 5px 0 0 0; opacity: 0.8; line-height: 1.2; }

        .footer { border-top: 3px solid #2c3e50; padding-top: 15px; display: flex; justify-content: space-between; align-items: flex-end; }
        .contact-info { text-align: left; }
        .name { font-size: 28px; font-weight: bold; margin: 0; color: #2c3e50; }
        .phone { font-size: 26px; color: #e67e22; font-weight: bold; margin: 0; }
        .serial-tag { font-size: 14px; color: #7f8c8d; font-family: monospace; font-weight: bold; }
    </style>
</head>
<body>
    <div id="content"></div>

    <script>
        const buildings = [
            { style: "Lofted Cabin (Repo)", size: "12 x 28", price: "$8,000", serial: "LC-1228-012224-125-IBP", img: "image1.jpeg" },
            { style: "Mini Barn", size: "12 x 24", price: "$5,740", serial: "MB-1224-01192026-0045", img: "image2.jpeg" },
            { style: "Mini Barn", size: "12 x 12", price: "$3,820", serial: "MB-1212-01162026-0029", img: "image3.jpeg" },
            { style: "Utility Shed (Repo)", size: "8 x 8", price: "$2,495", serial: "US-0808-082124-046-1FW", img: "image4.jpeg" },
            { style: "Lofted Garage (Repo)", size: "12 x 16", price: "$4,995", serial: "LG-1216-05823-071-IC", img: "image5.jpeg" },
            { style: "Standard Dog Kennel (Repo)", size: "8 x 8", price: "$995", serial: "SDK880225202011D", img: "image6.jpeg" },
            { style: "Standard Dog Kennel (Repo)", size: "8 x 8", price: "$995", serial: "SDK-88-05312025-4857", img: "image7.jpeg" },
            { style: "Run-in Shelter", size: "10 x 12", price: "$3,160", serial: "RS-1012-01232026-0010", img: "image8.jpeg" },
            { style: "Deluxe Dog Kennel", size: "8 x 12", price: "$4,765", serial: "DK-0812-012624-016-THS", img: "image9.png" },
            { style: "Cabin", size: "12 x 24", price: "$8,722", serial: "C-1224-05202025-4451", img: "image10.jpeg" },
            { style: "Utility Shed", size: "10 x 12", price: "$3,160", serial: "us-1012-070924-90-ic", img: "image11.jpeg" },
            { style: "Lofted Cabin", size: "10 x 16", price: "$5,630", serial: "LC-1016-08524-581-IC", img: "image13.jpeg" },
            { style: "Cabin", size: "12 x 24", price: "$7,790", serial: "C-1224-092624-106-IS", img: "image14.jpeg" },
            { style: "Garden Shed", size: "10 x 16", price: "$4,105", serial: "gs-1016-121224-112-is", img: "image15.jpeg" },
            { style: "Garden Shed", size: "12 x 16", price: "$5,320", serial: "gs-1216-081624-290-cl", img: "image16.jpeg" },
            { style: "Garden Shed (Repo)", size: "10 x 12", price: "$2,888", serial: "GS-1012-012623-THE-39", img: "image17.jpeg" },
            { style: "Garage (Repo)", size: "12 x 16", price: "$4,985", serial: "G-1216-030721-195-IK", img: "image18.jpeg" },
            { style: "Lofted Garden Shed", size: "12 x 24", price: "$6,990", serial: "LGS-1224-121224-115-IS", img: "image19.jpeg" },
            { style: "Garage (Repo)", size: "12 x 16", price: "$5,015", serial: "PG-1216-012023-THS-25", img: "image20.jpeg" },
            { style: "Garden Shed", size: "12 x 16", price: "$4,855", serial: "gs-1216-32823-023-ic", img: "image21.jpeg" },
            { style: "Lofted Barn", size: "12 x 16", price: "$5,520", serial: "LB-1216-072624-579-IC", img: "image22.jpeg" },
            { style: "Garden Shed", size: "8 x 12", price: "$2,990", serial: "GS-0812-04523-035-IC", img: "image23.jpeg" },
            { style: "Garden Shed", size: "12 x 16", price: "$4,945", serial: "gs-1216-32923-028-ic", img: "image25.jpeg" },
            { style: "Garden Shed", size: "10 x 12", price: "$3,295", serial: "gs-1012-111023-273-ic", img: "image2.jpeg" },
            { style: "Garage", size: "12 x 16", price: "$4,200", serial: "MPG-1216-041023-18-IBP", img: "image1.jpeg" }
        ];

        const content = document.getElementById('content');
        buildings.forEach((b, index) => {
            const page = document.createElement('div');
            page.className = 'flyer' + (index < buildings.length - 1 ? ' page-break' : '');
            page.innerHTML = `
                <div class="border-wrap">
                    <div>
                        <img src="https://hallmarkbarns.com/wp-content/themes/hallmark-barns/assets/images/logo.png" class="logo">
                        <h1>BUY NOW</h1>
                        <p class="subtitle">Available Today in Spencer, IN</p>
                    </div>
                    
                    <div class="building-photo-wrap">
                        <img src="actual_images/${b.img}" class="building-photo" onerror="this.src='https://hallmarkbarns.com/wp-content/uploads/2023/11/hallmark-barns-utility-shed-scaled.jpg'">
                    </div>

                    <div class="info-box">
                        <h2 class="style">${b.style}</h2>
                        <p class="size">${b.size}</p>
                        <div class="price">${b.price}</div>
                    </div>

                    <div class="qr-row">
                        <div class="qr-card">
                            <img src="https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=https://hallmarkspencer.com/order-rto.html?serial=${b.serial}">
                            <h3>BUY THIS UNIT</h3>
                            <p>Scan to start your <strong>Cash</strong> or <strong>RTO</strong> order online.</p>
                        </div>
                        <div class="qr-card">
                            <img src="https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=https://hallmarkspencer.com">
                            <h3>VIEW LOT LIST</h3>
                            <p>Check all buildings and carports at <strong>hallmarkspencer.com</strong></p>
                        </div>
                    </div>

                    <div class="footer">
                        <div style="text-align: left;">
                            <p class="name">Jared Baker</p>
                            <p class="phone">(317) 370-5720</p>
                        </div>
                        <div class="serial-tag">SN: ${b.serial}</div>
                    </div>
                </div>
            `;
            content.appendChild(page);
        });
    </script>
</body>
</html>
