<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Start My Order | Hallmark Spencer</title>
    <style>
        :root {
            --primary: #2c3e50;
            --accent: #e67e22;
            --light: #ecf0f1;
            --dark: #34495e;
            --success: #27ae60;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            margin: 0;
            padding: 0;
            background-color: #f4f7f6;
            color: #333;
        }
        .header {
            background-color: var(--primary);
            color: white;
            padding: 2rem 1rem;
            text-align: center;
        }
        .container {
            max-width: 800px;
            margin: -40px auto 40px;
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h2 { color: var(--primary); border-bottom: 2px solid var(--light); padding-bottom: 10px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; }
        input[type="text"], input[type="email"], input[type="tel"], select, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 1rem;
        }
        .radio-group { display: flex; gap: 20px; margin-top: 10px; }
        .radio-option { display: flex; align-items: center; gap: 5px; cursor: pointer; }
        .submit-btn {
            background-color: var(--success);
            color: white;
            padding: 15px 30px;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            font-size: 1.2rem;
            cursor: pointer;
            width: 100%;
            transition: background 0.3s;
        }
        .submit-btn:hover { background-color: #219150; }
        .back-link { display: block; text-align: center; margin-top: 20px; color: var(--primary); text-decoration: none; font-weight: bold; }
        .step-indicator { display: flex; justify-content: space-between; margin-bottom: 30px; text-align: center; }
        .step { flex: 1; padding: 10px; background: var(--light); border-radius: 4px; margin: 0 5px; font-size: 0.9rem; font-weight: bold; }
        .step.active { background: var(--accent); color: white; }
    </style>
</head>
<body>

<div class="header">
    <img src="images/logo.jpg" alt="Hallmark Portable Buildings" style="max-width: 250px; margin-bottom: 1rem;">
    <h1>Start My Order</h1>
    <p>Let's take the first step together.</p>
</div>

<div class="container">
    <div class="step-indicator">
        <div class="step active">1. Info</div>
        <div class="step">2. Contract</div>
        <div class="step">3. Deposit</div>
    </div>

    <form action="https://formsubmit.co/jbaker154@gmail.com" method="POST">
        <input type="hidden" name="_next" value="https://hallmarkspencer.com/success.html">
        <input type="hidden" name="_subject" value="New Order Request from Hallmark Spencer">
        <input type="hidden" name="_captcha" value="false">
        <input type="hidden" name="_template" value="table">
        <h2>Customer Information</h2>
        <div class="form-group">
            <label for="name">Full Name *</label>
            <input type="text" id="name" name="name" required placeholder="John Doe">
        </div>
        <div class="form-row" style="display: flex; gap: 20px;">
            <div class="form-group" style="flex: 1;">
                <label for="email">Email Address *</label>
                <input type="email" id="email" name="email" required placeholder="john@example.com">
            </div>
            <div class="form-group" style="flex: 1;">
                <label for="phone">Phone Number *</label>
                <input type="tel" id="phone" name="phone" required placeholder="(317) 555-0123">
            </div>
        </div>
        <div class="form-group">
            <label for="address">Delivery Address *</label>
            <input type="text" id="address" name="address" required placeholder="123 Main St, Spencer, IN">
        </div>

        <h2>Building Details</h2>
        <div class="form-group">
            <label for="style">Structure Style</label>
            <select id="style" name="style">
                <option value="lofted-barn">Lofted Barn</option>
                <option value="utility-shed">Utility Shed</option>
                <option value="cabin">Cabin / Lofted Cabin</option>
                <option value="garage">Garage</option>
                <option value="carport">Steel Carport / RV Cover</option>
                <option value="deck">Timbercraft Deck</option>
                <option value="other">Other / Custom</option>
            </select>
        </div>
        <div class="form-group">
            <label for="details">Specifications (Size, Colors, Options)</label>
            <textarea id="details" name="details" rows="4" placeholder="e.g. 10x16 Lofted Barn, Barn Red with White trim, 9-light door..."></textarea>
        </div>

        <h2>Payment Preference</h2>
        <div class="radio-group">
            <label class="radio-option">
                <input type="radio" name="payment" value="rto" checked> Rent-To-Own (No Credit Check)
            </label>
            <label class="radio-option">
                <input type="radio" name="payment" value="cash"> Cash / Full Payment
            </label>
        </div>

        <div style="margin-top: 30px;">
            <button type="submit" class="submit-btn">Submit & Send My Quote</button>
        </div>
        
        <p style="font-size: 0.8rem; color: #666; margin-top: 15px; text-align: center;">
            By clicking submit, you'll receive a follow-up email from Jared Baker with your quote and next steps for contracts.
        </p>
    </form>
    
    <a href="index.html" class="back-link">← Back to Home</a>
</div>

</body>
</html>
