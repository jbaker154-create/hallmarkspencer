<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Current Lot Inventory | Hallmark Spencer</title>
    <style>
        :root {
            --primary: #2c3e50;
            --accent: #e67e22;
            --success: #27ae60;
            --cash: #2980b9;
            --light: #f4f7f6;
        }
        body { font-family: 'Segoe UI', sans-serif; line-height: 1.6; margin: 0; background: var(--light); color: #333; }
        header { background: var(--primary); color: white; padding: 2rem; text-align: center; }
        .container { max-width: 1200px; margin: 20px auto; padding: 0 20px; }
        .inventory-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 25px; margin-top: 30px; }
        .unit-card { background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 6px 15px rgba(0,0,0,0.1); border: 1px solid #ddd; display: flex; flex-direction: column; transition: transform 0.2s; }
        .unit-card:hover { transform: translateY(-5px); }
        .unit-img { width: 100%; height: 220px; object-fit: contain; background: #f8f9fa; border-bottom: 3px solid var(--accent); }
        .unit-info { padding: 20px; flex-grow: 1; text-align: center; }
        .unit-style { font-size: 1.4rem; font-weight: bold; color: var(--primary); margin: 0; }
        .unit-size { color: #666; font-size: 1.1rem; margin: 5px 0; }
        .unit-serial { font-family: monospace; font-size: 0.85rem; color: #999; margin-bottom: 10px; display: block; }
        .unit-price { font-size: 2.2rem; font-weight: 900; color: var(--success); margin: 15px 0; }
        .btn-group { display: flex; gap: 10px; margin-top: 15px; }
        .buy-btn { flex: 1; text-align: center; color: white; text-decoration: none; padding: 12px 5px; border-radius: 6px; font-weight: bold; font-size: 0.9rem; transition: opacity 0.2s; }
        .buy-btn.rto { background: var(--accent); }
        .buy-btn.cash { background: var(--cash); }
        .buy-btn:hover { opacity: 0.9; }
        .back-link { display: inline-block; margin-bottom: 20px; color: var(--primary); text-decoration: none; font-weight: bold; }
        .badge { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 0.75rem; font-weight: bold; margin-bottom: 10px; }
        .badge-repo { background: #ff4757; color: white; }
        .badge-new { background: var(--success); color: white; }
    </style>
</head>
<body>

<header>
    <h1>Current Lot Inventory</h1>
    <p>Available Today in Spencer, IN — Buy Now or Rent-To-Own</p>
</header>

<div class="container">
    <a href="index.html" class="back-link">← Back to Home</a>
    <div class="inventory-grid" id="inventory"></div>
</div>

<script>
    const buildings = [
        { style: "Cabin (Repo)", size: "14 x 28", price: "$8,995", serial: "C-1428-03122025-1621", type: "repo", img: "actual_images/image1.jpeg" },
        { style: "Mini Barn", size: "8 x 8", price: "$2,040", serial: "MB-88-10302025-0114", type: "new", img: "actual_images/MB-88-10302025-0114-front.jpg" },
        { style: "Utility Shed", size: "8 x 12", price: "$2,990", serial: "US-817-10302025-0203", type: "new", img: "actual_images/image12.png" },
        { style: "Garden Shed", size: "10 x 16", price: "$4,105", serial: "gs-1010-121224-112-is", type: "new", img: "actual_images/image13.jpeg" },
        { style: "Utility Shed", size: "10 x 12", price: "$3,160", serial: "us1012-070924-90--ic", type: "new", img: "actual_images/us-1012-070924-90-ic.jpg" },
        { style: "Lofted Cabin (Repo)", size: "12 x 28", price: "$8,000", serial: "LC-1228-012224-125-IBP", type: "repo", img: "actual_images/image1.jpeg" },
        { style: "Mini Barn", size: "12 x 24", price: "$5,740", serial: "MB-1224-01192026-0045", type: "new", img: "actual_images/image2.jpeg" },
        { style: "Mini Barn", size: "12 x 12", price: "$3,820", serial: "MB-1212-01162026-0029", type: "new", img: "actual_images/image3.jpeg" },
        { style: "Lofted Garage", size: "12 x 16", price: "$4,995", serial: "LG-1216-05823-071-10", type: "new", img: "actual_images/image5.jpeg" },
        { style: "Standard Dog Kennel (Repo)", size: "8 x 8", price: "$995", serial: "SDK8802252020110", type: "repo", img: "actual_images/image6.jpeg" },
        { style: "Run-in Shelter", size: "10 x 12", price: "$3,160", serial: "RS-1012-01232028-0010", type: "new", img: "actual_images/image8.jpeg" },
        { style: "Deluxe Dog Kennel", size: "8 x 12", price: "$4,785", serial: "DK-0812-012624-016-THS", type: "new", img: "actual_images/image9.png" },
        { style: "Cabin", size: "12 x 24", price: "$8,722", serial: "C-1224-05202025-4451", type: "new", img: "actual_images/image10.jpeg" },
        { style: "Lofted Cabin", size: "10 x 16", price: "$5,630", serial: "LC-1016-08524-581-10", type: "new", img: "actual_images/LC-1016-08524-581-IC.jpg" },
        { style: "Cabin", size: "12 x 24", price: "$7,790", serial: "C1224-092624-106--IS", type: "new", img: "actual_images/C-1224-092624-106-IS.jpg" },
        { style: "Garden Shed", size: "12 x 16", price: "$5,320", serial: "gs-1216-081624-290-1", type: "new", img: "actual_images/gs-1216-081624-290-cl.jpg" },
        { style: "Garden Shed (Repo)", size: "10 x 12", price: "$2,888", serial: "GS-1012-012623-THE-39", type: "repo", img: "actual_images/GS-1012-012623-THE-39.jpg" },
        { style: "Garage (Repo)", size: "12 x 16", price: "$4,965", serial: "G1216-000721-195--IK", type: "repo", img: "actual_images/G-1216-030721-195-IK.jpg" },
        { style: "Garage (Repo)", size: "12 x 16", price: "$5,015", serial: "PG-1216-012023-THS-25", type: "repo", img: "actual_images/PG-1216-012023-THS-25.jpg" },
        { style: "Garden Shed", size: "12 x 16", price: "$4,855", serial: "gs-1216-32823-023-ic", type: "new", img: "actual_images/gs-1216-32823-023-ic.jpg" },
        { style: "Lofted Barn", size: "12 x 16", price: "$5,520", serial: "LB-1216-072624-579-IC", type: "new", img: "actual_images/LB-1216-072624-579-IC.jpg" },
        { style: "Garden Shed", size: "8 x 12", price: "$2,990", serial: "GS-0812-04523-035-IC", type: "new", img: "actual_images/GS-0812-04523-035-IC.jpg" },
        { style: "Garden Shed", size: "12 x 16", price: "$4,945", serial: "gs1216-32923-028--", type: "new", img: "actual_images/gs-1216-32923-028-ic.jpg" },
        { style: "Garden Shed", size: "10 x 12", price: "$3,295", serial: "gs1012-111023-273--", type: "new", img: "actual_images/gs-1012-111023-273-ic.jpg" }
    ];

    const grid = document.getElementById('inventory');
    buildings.forEach(b => {
        const card = document.createElement('div');
        card.className = 'unit-card';
        card.innerHTML = `
            <img src="${b.img}" class="unit-img" onerror="this.src='https://hallmarkbarns.com/wp-content/uploads/2023/11/hallmark-barns-utility-shed-scaled.jpg'">
            <div class="unit-info">
                <span class="badge ${b.type === 'repo' ? 'badge-repo' : 'badge-new'}">${b.type.toUpperCase()}</span>
                <p class="unit-style">${b.style}</p>
                <p class="unit-size">${b.size}</p>
                <span class="unit-serial">SN: ${b.serial}</span>
                <div class="unit-price">${b.price}</div>
                <div class="btn-group">
                    <a href="order-rto.html?serial=${b.serial}&style=${encodeURIComponent(b.style)}&size=${encodeURIComponent(b.size)}" class="buy-btn rto">START RTO</a>
                    <a href="order.html?serial=${b.serial}&style=${encodeURIComponent(b.style)}&size=${encodeURIComponent(b.size)}" class="buy-btn cash">BUY CASH</a>
                </div>
            </div>
        `;
        grid.appendChild(card);
    });
</script>

</body>
</html>
