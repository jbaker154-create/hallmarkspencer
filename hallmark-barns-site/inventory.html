<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Current Lot Inventory | Hallmark Spencer</title>
    <style>
        :root {
            --primary: #2c3e50;
            --accent: #e67e22;
            --success: #27ae60;
            --cash: #2980b9;
            --light: #f4f7f6;
        }
        body { font-family: 'Segoe UI', sans-serif; line-height: 1.6; margin: 0; background: var(--light); color: #333; }
        header { background: var(--primary); color: white; padding: 2rem; text-align: center; }
        .container { max-width: 1200px; margin: 20px auto; padding: 0 20px; }
        .inventory-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 25px; margin-top: 30px; }
        .unit-card { background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 6px 15px rgba(0,0,0,0.1); border: 1px solid #ddd; display: flex; flex-direction: column; transition: transform 0.2s; }
        .unit-card:hover { transform: translateY(-5px); }
        .unit-img { width: 100%; height: 220px; object-fit: contain; background: #f8f9fa; border-bottom: 3px solid var(--accent); }
        .unit-info { padding: 20px; flex-grow: 1; text-align: center; }
        .unit-style { font-size: 1.4rem; font-weight: bold; color: var(--primary); margin: 0; }
        .unit-size { color: #666; font-size: 1.1rem; margin: 5px 0; }
        .unit-serial { font-family: monospace; font-size: 0.85rem; color: #999; margin-bottom: 10px; display: block; }
        .unit-price { font-size: 2.2rem; font-weight: 900; color: var(--success); margin: 15px 0; }
        .btn-group { display: flex; gap: 10px; margin-top: 15px; }
        .buy-btn { flex: 1; text-align: center; color: white; text-decoration: none; padding: 12px 5px; border-radius: 6px; font-weight: bold; font-size: 0.9rem; transition: opacity 0.2s; }
        .buy-btn.rto { background: var(--accent); }
        .buy-btn.cash { background: var(--cash); }
        .buy-btn:hover { opacity: 0.9; }
        .back-link { display: inline-block; margin-bottom: 20px; color: var(--primary); text-decoration: none; font-weight: bold; }
        .badge { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 0.75rem; font-weight: bold; margin-bottom: 10px; }
        .badge-repo { background: #ff4757; color: white; }
        .badge-new { background: var(--success); color: white; }
    </style>
</head>
<body>

<header>
    <h1>Current Lot Inventory</h1>
    <p>Available Today in Spencer, IN — Buy Now or Rent-To-Own</p>
</header>

<div class="container">
    <a href="index.html" class="back-link">← Back to Home</a>
    <div class="inventory-grid" id="inventory"></div>
</div>

<script>
    const buildings = [
        { "style": "Utility Shed", "size": "8 x 8", "price": "$2,680.00", "serial": "J011046", "type": "new", "img": "actual_images/utility_shed_8x8.png" },
        { "style": "Deluxe Dog Kennel (Repo)", "size": "8 x 12", "price": "$2,995.00", "serial": "J011400", "type": "repo", "img": "actual_images/deluxe_dog_kennel_repo_8x12_1.png" },
        { "style": "Garden Shed", "size": "10 x 12", "price": "$3,200.00", "serial": "J008906", "type": "new", "img": "actual_images/garden_shed_10x12.png" },
        { "style": "Garden Shed (Repo)", "size": "12 x 16", "price": "$4,720.00", "serial": "J009033", "type": "repo", "img": "actual_images/garden_shed_repo_12x16.png" },
        { "style": "Deluxe Dog Kennel (Repo)", "size": "8 x 12", "price": "$4,785.00", "serial": "J008304", "type": "repo", "img": "actual_images/deluxe_dog_kennel_repo_8x12_2.png" },
        { "style": "Cabin", "size": "12 x 24", "price": "$8,722.00", "serial": "J010266", "type": "new", "img": "actual_images/cabin_12x24.png" },
        { "style": "Mini Barn", "size": "8 x 8", "price": "$2,040.00", "serial": "J008914", "type": "new", "img": "actual_images/mini_barn_8x8.png" },
        { "style": "Lofted Garden Shed", "size": "12 x 24", "price": "$7,050.00", "serial": "J010645", "type": "new", "img": "actual_images/lofted_garden_shed_12x24.png" },
        { "style": "Playhouse", "size": "8 x 12", "price": "$2,895.00", "serial": "J011047", "type": "new", "img": "actual_images/playhouse_8x12.png" },
        { "style": "Playhouse (Repo)", "size": "10 x 12", "price": "$3,495.00", "serial": "J010492", "type": "repo", "img": "actual_images/playhouse_repo_10x12.png" },
        { "style": "Cabin", "size": "14 x 28", "price": "$8,995.00", "serial": "J011388", "type": "new", "img": "actual_images/cabin_14x28.png" },
        { "style": "Mini Barn", "size": "12 x 24", "price": "$5,740.00", "serial": "J011314", "type": "new", "img": "actual_images/mini_barn_12x24.png" },
        { "style": "Run-in Shelter", "size": "10 x 12", "price": "$3,160.00", "serial": "J010182", "type": "new", "img": "actual_images/run_in_shelter_10x12.png" },
        { "style": "Cabin", "size": "11 x 24", "price": "$7,790.00", "serial": "J011425", "type": "new", "img": "actual_images/cabin_11x24.png" },
        { "style": "Garden Shed", "size": "12 x 16", "price": "$4,855.00", "serial": "J011326", "type": "new", "img": "actual_images/garden_shed_12x16.png" },
        { "style": "Lofted Barn", "size": "12 x 16", "price": "$5,520.00", "serial": "J010641", "type": "new", "img": "actual_images/lofted_barn_12x16.png" },
        { "style": "Garden Shed", "size": "12 x 16", "price": "$4,945.00", "serial": "J010903", "type": "new", "img": "actual_images/garden_shed_12x16_2.png" },
        { "style": "Garden Shed", "size": "10 x 12", "price": "$3,295.00", "serial": "J010892", "type": "new", "img": "actual_images/garden_shed_10x12_2.png" }
    ];

    const grid = document.getElementById('inventory');
    buildings.forEach(b => {
        const card = document.createElement('div');
        card.className = 'unit-card';
        card.innerHTML = `
            <img src="${b.img}" class="unit-img" onerror="this.src='https://hallmarkbarns.com/wp-content/uploads/2023/11/hallmark-barns-utility-shed-scaled.jpg'">
            <div class="unit-info">
                <span class="badge ${b.type === 'repo' ? 'badge-repo' : 'badge-new'}">${b.type.toUpperCase()}</span>
                <p class="unit-style">${b.style}</p>
                <p class="unit-size">${b.size}</p>
                <span class="unit-serial">SN: ${b.serial}</span>
                <div class="unit-price">${b.price}</div>
                <div class="btn-group">
                    <a href="order-rto.html?serial=${b.serial}&style=${encodeURIComponent(b.style)}&size=${encodeURIComponent(b.size)}" class="buy-btn rto">START RTO</a>
                    <a href="order.html?serial=${b.serial}&style=${encodeURIComponent(b.style)}&size=${encodeURIComponent(b.size)}" class="buy-btn cash">BUY CASH</a>
                </div>
            </div>
        `;
        grid.appendChild(card);
    });
</script>

</body>
</html>
