<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Available Inventory | Hallmark Spencer</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #1e293b;
            --accent: #f59e0b;
            --success: #10b981;
            --repo: #ef4444;
            --builder: #3b82f6;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
            --text-muted: #64748b;
        }

        * { box-sizing: border-box; }
        body { 
            font-family: 'Inter', -apple-system, sans-serif; 
            background-color: var(--bg); 
            color: var(--text); 
            margin: 0; 
            line-height: 1.5;
        }

        header {
            background: var(--primary);
            color: white;
            padding: 4rem 2rem;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        header::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--accent), var(--success));
        }

        header h1 { 
            font-size: 3rem; 
            margin: 0; 
            font-weight: 800; 
            letter-spacing: -0.025em;
        }

        header p { 
            font-size: 1.25rem; 
            opacity: 0.9; 
            max-width: 600px; 
            margin: 1rem auto 0;
        }

        .nav-bar {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(12px);
            padding: 1rem 2rem;
            border-bottom: 1px solid #e2e8f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .back-link {
            text-decoration: none;
            color: var(--text);
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: color 0.2s;
        }

        .back-link:hover { color: var(--accent); }

        .container {
            max-width: 1280px;
            margin: 2rem auto;
            padding: 0 2rem;
        }

        .inventory-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 2rem;
        }

        .unit-card {
            background: var(--card-bg);
            border-radius: 1rem;
            overflow: hidden;
            border: 1px solid #e2e8f0;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .unit-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            border-color: var(--accent);
        }

        .unit-img-wrapper {
            position: relative;
            width: 100%;
            height: 240px;
            background: #f1f5f9;
        }

        .unit-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s;
        }

        .unit-card:hover .unit-img {
            transform: scale(1.05);
        }

        .badge {
            position: absolute;
            top: 1rem;
            left: 1rem;
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: white;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .badge-new { background-color: var(--success); }
        .badge-repo { background-color: var(--repo); }
        .badge-builder { background-color: var(--builder); }

        .unit-info {
            padding: 1.5rem;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        .unit-style {
            font-size: 1.25rem;
            font-weight: 700;
            margin: 0;
            color: var(--primary);
        }

        .unit-size {
            font-size: 1rem;
            color: var(--text-muted);
            margin: 0.25rem 0 1rem;
        }

        .unit-serial {
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: 0.75rem;
            color: var(--text-muted);
            background: #f1f5f9;
            padding: 0.25rem 0.5rem;
            border-radius: 0.25rem;
            align-self: flex-start;
        }

        .unit-price {
            font-size: 2rem;
            font-weight: 800;
            color: var(--primary);
            margin: 1.5rem 0;
        }

        .btn-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.75rem;
            margin-top: auto;
        }

        .buy-btn {
            text-align: center;
            text-decoration: none;
            padding: 0.75rem;
            border-radius: 0.5rem;
            font-weight: 700;
            font-size: 0.875rem;
            transition: all 0.2s;
        }

        .buy-btn.rto {
            background: var(--accent);
            color: white;
        }

        .buy-btn.cash {
            background: var(--primary);
            color: white;
        }

        .buy-btn:hover {
            filter: brightness(1.1);
            transform: scale(1.02);
        }

        @media (max-width: 640px) {
            header h1 { font-size: 2rem; }
            .inventory-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>

        let badgeClass = 'badge-new';

        if (isRepo) {
