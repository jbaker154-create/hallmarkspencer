<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Current Lot Inventory | Hallmark Spencer</title>
    <style>
        :root {
            --primary: #2c3e50;
            --accent: #e67e22;
            --success: #27ae60;
            --cash: #2980b9;
            --light: #f4f7f6;
        }
        body { font-family: 'Segoe UI', sans-serif; line-height: 1.6; margin: 0; background: var(--light); color: #333; }
        header { background: var(--primary); color: white; padding: 2rem; text-align: center; }
        .container { max-width: 1200px; margin: 20px auto; padding: 0 20px; }
        .inventory-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 25px; margin-top: 30px; }
        .unit-card { background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 6px 15px rgba(0,0,0,0.1); border: 1px solid #ddd; display: flex; flex-direction: column; transition: transform 0.2s; }
        .unit-card:hover { transform: translateY(-5px); }
        .unit-img { width: 100%; height: 220px; object-fit: contain; background: #f8f9fa; border-bottom: 3px solid var(--accent); }
        .unit-info { padding: 20px; flex-grow: 1; text-align: center; }
        .unit-style { font-size: 1.4rem; font-weight: bold; color: var(--primary); margin: 0; }
        .unit-size { color: #666; font-size: 1.1rem; margin: 5px 0; }
        .unit-serial { font-family: monospace; font-size: 0.85rem; color: #999; margin-bottom: 10px; display: block; }
        .unit-price { font-size: 2.2rem; font-weight: 900; color: var(--success); margin: 15px 0; }
        .btn-group { display: flex; gap: 10px; margin-top: 15px; }
        .buy-btn { flex: 1; text-align: center; color: white; text-decoration: none; padding: 12px 5px; border-radius: 6px; font-weight: bold; font-size: 0.9rem; transition: opacity 0.2s; }
        .buy-btn.rto { background: var(--accent); }
        .buy-btn.cash { background: var(--cash); }
        .buy-btn:hover { opacity: 0.9; }
        .back-link { display: inline-block; margin-bottom: 20px; color: var(--primary); text-decoration: none; font-weight: bold; }
        .badge { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 0.75rem; font-weight: bold; margin-bottom: 10px; }
        .badge-repo { background: #ff4757; color: white; }
        .badge-new { background: var(--success); color: white; }
    </style>
</head>
<body>

<header>
    <h1>Current Lot Inventory</h1>
    <p>Available Today in Spencer, IN — Buy Now or Rent-To-Own</p>
</header>

<div class="container">
    <a href="index.html" class="back-link">← Back to Home</a>
    <div class="inventory-grid" id="inventory"></div>
</div>

<script>
    const buildings = [
  { "style": "Mini Barn", "category": "New Inventory", "size": "8 x 12", "price": "$2,752.00", "serial": "MB-812-04152026-0085", "img": "https://dms.hallmarkbarns.com/storage/dealer/2026/06/01KTEFM2BRS5ZSCKBJ9QCQPN1R.jpg" },
  { "style": "Lofted Barn", "category": "Repo", "size": "12 x 16", "price": "$4,995.00", "serial": "LB-1216-LB-1216-100224-04-MI", "img": "https://dms.hallmarkbarns.com/storage/dealer/2026/06/01KTCBR7BFDFDK9XSARY42WHEA.jpg" },
  { "style": "Cabin", "category": "Repo", "size": "12 x 20", "price": "$6,660.00", "serial": "C-1220-07252025-NRE", "img": "https://dms.hallmarkbarns.com/storage/dealer/2026/06/01KTA2AADMNP9M8K146FK3FJSY.jpg" },
  { "style": "Utility Shed", "category": "Repo", "size": "8 x 16", "price": "$3,295.00", "serial": "US-816-06132025-5116", "img": "https://dms.hallmarkbarns.com/storage/dealer/2026/05/01KSTRHRNK6879W2Q78N2ET05Q.jpg" },
  { "style": "Lofted Garden Shed", "category": "New Inventory", "size": "10 x 16", "price": "$5,509.38", "serial": "LGS-1016-04152026-0029", "img": "https://dms.hallmarkbarns.com/storage/dealer/2026/05/01KSP48SGVGT6PYTQF7XBMA3BJ.jpg" },
  { "style": "Utility Shed", "category": "New Inventory", "size": "10 x 12", "price": "$3,397.00", "serial": "US-1012-04062026-0040", "img": "https://dms.hallmarkbarns.com/storage/dealer/2026/05/01KSMWZ2TH02JD7ME8G4JHN89R.jpg" },
  { "style": "Chicken Coop", "category": "New Inventory", "size": "6 x 8", "price": "$2,848.75", "serial": "CC-68-03242026-0047", "img": "https://dms.hallmarkbarns.com/storage/dealer/2026/05/01KSMWWE86F1Q0T396FN2D35DK.jpg" },
  { "style": "Lofted Cabin", "category": "New Inventory", "size": "12 x 28", "price": "$9,384.75", "serial": "LC-1228-03212026-0023", "img": "https://dms.hallmarkbarns.com/storage/dealer/2026/05/01KS7WJAM31DKHP4F9C0J0FEVD.jpg" },
  { "style": "Garage", "category": "New Inventory", "size": "12 x 16", "price": "$6,235.00", "serial": "PG-1216-03272026-0093", "img": "https://dms.hallmarkbarns.com/storage/dealer/2026/05/01KS0E22XGC6FQX05XP3NRFMVT.jpg" },
  { "style": "Garage", "category": "New Inventory", "size": "12 x 12", "price": "$5,418.00", "serial": "PG-1212-03272026-0094", "img": "https://dms.hallmarkbarns.com/storage/dealer/2026/05/01KS0E4SSWFEHRJJ9E6TXDBZQ1.jpg" },
  { "style": "Mini Barn", "category": "New Inventory", "size": "8 x 8", "price": "$2,193.00", "serial": "MB-88-04152026-0084", "img": "https://dms.hallmarkbarns.com/storage/dealer/2026/05/01KS0E8EVNNHDQYD5K7D9HBFKD.jpg" },
  { "style": "Run-in Shelter", "category": "New Inventory", "size": "10 x 12", "price": "$3,397.00", "serial": "RS-1012-01232026-0010", "img": "https://dms.hallmarkbarns.com/storage/dealer/2026/02/01KGSPRKADA1AQ33HPEX5C1451.jpg" },
  { "style": "Utility Shed", "category": "New Inventory", "size": "8 x 8", "price": "$2,881.00", "serial": "US-88-01192026-0059", "img": "https://dms.hallmarkbarns.com/storage/dealer/2026/04/01KNC95J1PZZVMG5P9XV5PAXBM.jpg" }
    ];

    const grid = document.getElementById('inventory');
    buildings.forEach(b => {
        const card = document.createElement('div');
        card.className = 'unit-card';
        card.innerHTML = `
            <img src="${b.img}" class="unit-img" onerror="this.src='https://hallmarkbarns.com/wp-content/uploads/2023/11/hallmark-barns-utility-shed-scaled.jpg'">
            <div class="unit-info">
                <span class="badge ${b.category.toLowerCase().includes('repo') ? 'badge-repo' : 'badge-new'}">${b.category.toUpperCase()}</span>
                <p class="unit-style">${b.style}</p>
                <p class="unit-size">${b.size}</p>
                <span class="unit-serial">SN: ${b.serial}</span>
                <div class="unit-price">${b.price}</div>
                <div class="btn-group">
                    <a href="order-rto.html?serial=${b.serial}&style=${encodeURIComponent(b.style)}&size=${encodeURIComponent(b.size)}" class="buy-btn rto">START RTO</a>
                    <a href="order.html?serial=${b.serial}&style=${encodeURIComponent(b.style)}&size=${encodeURIComponent(b.size)}" class="buy-btn cash">BUY CASH</a>
                </div>
            </div>
        `;
        grid.appendChild(card);
    });
</script>

</body>
</html>
