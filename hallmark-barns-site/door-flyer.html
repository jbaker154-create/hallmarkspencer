<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hallmark Spencer Door Flyer</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: white;
            color: #333;
        }
        .flyer-container {
            width: 8.5in;
            height: 10.5in; /* Slightly less than 11 to avoid spillover */
            padding: 0.3in;
            box-sizing: border-box;
            border: 8px solid #2c3e50;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            text-align: center;
            overflow: hidden;
        }
        .header-logo {
            max-width: 3in;
            margin-bottom: 10px;
        }
        .main-title {
            font-size: 36pt;
            color: #2c3e50;
            margin: 0;
            text-transform: uppercase;
            font-weight: bold;
        }
        .subtitle {
            font-size: 20pt;
            color: #e67e22;
            margin-bottom: 15px;
            font-weight: bold;
        }
        .photo-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            width: 100%;
            margin-bottom: 20px;
        }
        .photo-grid img {
            width: 100%;
            height: 2.2in;
            object-fit: cover;
            border-radius: 8px;
            border: 2px solid #ecf0f1;
        }
        .promo-text {
            font-size: 16pt;
            line-height: 1.3;
            margin-bottom: 20px;
            font-weight: 500;
        }
        .cta-section {
            display: flex;
            justify-content: space-around;
            width: 100%;
            align-items: center;
            background: #f9f9f9;
            padding: 15px;
            border-radius: 15px;
        }
        .qr-block {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .qr-code {
            width: 1.3in;
            height: 1.3in;
            background: white;
            padding: 5px;
            border: 2px solid #2c3e50;
        }
        .qr-label {
            margin-top: 5px;
            font-weight: bold;
            font-size: 12pt;
        }
        .footer-info {
            margin-top: auto;
            padding-bottom: 10px;
            width: 100%;
            font-size: 14pt;
            font-weight: bold;
            color: #2c3e50;
        }
        .accent-bar {
            width: 100%;
            height: 10px;
            background: #e67e22;
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <div class="flyer-container">
        <img src="actual_images/hallmark-logo.jpg" class="header-logo" alt="Hallmark Logo">
        
        <h1 class="main-title">Hallmark Spencer</h1>
        <div class="subtitle">Portable Buildings • Carports • Decks</div>
        
        <div class="photo-grid">
            <img src="actual_images/hallmark-portable-buildings.png" alt="Building">
            <img src="actual_images/decks/10x10-garden.png" alt="Deck">
        </div>

        <p class="promo-text">
            <strong>Custom built for you.</strong><br>
            Quality craftsmanship, local service, and low monthly payments.<br>
            No Credit Check Rent-to-Own available!
        </p>

        <div class="accent-bar"></div>

        <div class="cta-section">
            <div class="qr-block">
                <!-- Using an online QR generator for simplicity in HTML -->
                <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=https://hallmarkspencer.com" class="qr-code" alt="QR Code">
                <div class="qr-label">Visit Our Website</div>
            </div>
            
            <div class="qr-block">
                <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=https://hallmarkspencer.com/order-rto" class="qr-code" alt="QR Code">
                <div class="qr-label">Apply for Approval</div>
            </div>
        </div>

        <div class="footer-info">
            Call or Text Jared: (317) 370-5720
        </div>
    </div>
</body>
</html>
