<!DOCTYPE html>
<html lang="en">
<head>

    <title>Hallmark Spencer Green Barn Flyer</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 8.5in;

    <div class="flyer-page">
        <img src="actual_images/green-barn-flyer-base.jpg" class="flyer-image" alt="Hallmark Spencer Flyer">
